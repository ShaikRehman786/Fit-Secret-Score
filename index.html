<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Fit Secrets Store - Vijayawada's most trusted fitness and nutrition store. 5.0 rating, 210+ Google reviews. Supplements, ayurvedic, organic, dry fruits & more." />
    <meta name="keywords" content="supplements, ayurvedic, organic, dry fruits, Vijayawada, fitness, nutrition, cold pressed oils, honey, ghee" />
    <meta property="og:title" content="Fit Secrets Store | Vijayawada's Most Trusted Fitness Store" />
    <meta property="og:description" content="Your Body. Your Rules. Your Results. Vijayawada's most trusted fitness and nutrition store — 5.0 Rating, 210+ Reviews." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://fitsecrets.store" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <title>Fit Secrets Store | Vijayawada's Most Trusted Fitness Store</title>
    <script>
      (function() {
        const loader = document.getElementById('page-loader');
        if (loader) {
          let progress = 0;
          const interval = setInterval(() => {
            progress += Math.random() * 12;
            if (progress > 85) progress = 85;
            const bar = loader.querySelector('.loader-bar');
            if (bar) bar.style.width = progress + '%';
          }, 200);
          window.__loaderInterval = interval;
        }
        window.addEventListener('load', function() {
          const interval = window.__loaderInterval;
          if (interval) clearInterval(interval);
          const loader = document.getElementById('page-loader');
          if (loader) {
            const bar = loader.querySelector('.loader-bar');
            if (bar) bar.style.width = '100%';
            setTimeout(function() {
              loader.style.opacity = '0';
              setTimeout(function() {
                loader.style.display = 'none';
              }, 400);
            }, 500);
          }
        });
      })();
    </script>
  </head>
  <body>
    <div id="page-loader" style="position:fixed;inset:0;z-index:99999;background:#0a2e1a;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity 0.4s">
      <div style="width:70px;height:70px;border:4px solid rgba(34,197,94,0.15);border-top-color:#22c55e;border-radius:50%;animation:spin 0.7s linear infinite"></div>
      <div style="margin-top:24px;font-family:Inter,sans-serif;font-size:18px;font-weight:800;color:#22c55e;letter-spacing:3px">FIT SECRETS</div>
      <div style="margin-top:16px;width:180px;height:3px;background:rgba(255,255,255,0.08);border-radius:2px;overflow:hidden">
        <div class="loader-bar" style="width:0%;height:100%;background:#22c55e;border-radius:2px;transition:width 0.3s"></div>
      </div>
      <style>
        @keyframes spin { to { transform: rotate(360deg); } }
      </style>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
